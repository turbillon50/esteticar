<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#03045e"/>
      <stop offset="45%" style="stop-color:#0077b6"/>
      <stop offset="80%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#48cae4"/>
    </linearGradient>
    <linearGradient id="foam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Foam shimmer top-right -->
  <ellipse cx="380" cy="100" rx="160" ry="110" fill="url(#foam)" opacity="0.6"/>
  <!-- Bubble deco -->
  <circle cx="420" cy="80" r="45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="390" cy="150" r="25" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="80" cy="400" r="60" fill="rgba(0,180,216,0.15)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="110" cy="360" r="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Letter E -->
  <text x="256" y="340" font-family="Arial Black, Arial" font-weight="900" font-size="260" fill="white" text-anchor="middle" opacity="0.97">E</text>
</svg>
