kind = "web"
previewPath = "/"
title = "Esteticar"
version = "1.0.0"
id = "artifacts/esteticar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22125

[services.development]
run = "pnpm --filter @workspace/esteticar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/esteticar", "run", "build" ]
publicDir = "artifacts/esteticar/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22125"
BASE_PATH = "/"
