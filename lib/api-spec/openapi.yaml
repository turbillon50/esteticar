openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Esteticar Car Wash Booking Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: services
    description: Car wash services
  - name: locations
    description: Car wash locations
  - name: bookings
    description: Appointment bookings
  - name: timeslots
    description: Time slot management
  - name: providers
    description: Service providers (washers)
  - name: admin
    description: Admin operations
  - name: dashboard
    description: Dashboard and stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # SERVICES
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all available services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a new service (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceBody"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a specific service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateService
      tags: [services]
      summary: Update a service (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceBody"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # LOCATIONS
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all locations
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a new location (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationBody"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a specific location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationBody"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # TIME SLOTS
  /timeslots:
    get:
      operationId: listTimeslots
      tags: [timeslots]
      summary: List available time slots for a location and date
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: serviceId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Timeslot"

  /timeslots/configure:
    post:
      operationId: configureTimeslots
      tags: [timeslots]
      summary: Configure time slots for a location (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureTimeslotsBody"
      responses:
        "200":
          description: Time slots configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # BOOKINGS
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for current user (or all if admin)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [confirmed, completed, cancelled]
        - name: upcoming
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Slot unavailable or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a specific booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (cancel, complete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusBody"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # PROVIDER ROUTES
  /provider/schedule:
    get:
      operationId: getProviderSchedule
      tags: [providers]
      summary: Get provider's daily schedule
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Provider schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /provider/stats:
    get:
      operationId: getProviderStats
      tags: [providers]
      summary: Get provider statistics
      responses:
        "200":
          description: Provider stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStats"

  # ADMIN ROUTES
  /admin/providers:
    get:
      operationId: listProviders
      tags: [admin]
      summary: List all service providers
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createProvider
      tags: [admin]
      summary: Create a service provider account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderBody"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/providers/{id}/assign:
    post:
      operationId: assignProviderToLocation
      tags: [admin]
      summary: Assign provider to a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignProviderBody"
      responses:
        "200":
          description: Provider assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/bookings:
    get:
      operationId: listAllBookings
      tags: [admin]
      summary: List all bookings (admin view)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [confirmed, completed, cancelled]
        - name: locationId
          in: query
          required: false
          schema:
            type: integer
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: All bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Get admin dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get customer dashboard summary (upcoming bookings, recent activity)
      responses:
        "200":
          description: Customer dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [customer, provider, admin]
        phone:
          type: string
          nullable: true
        locationId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - createdAt

    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
      required:
        - name
        - email
        - password

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user
        - message

    Service:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        durationMinutes:
          type: integer
        imageUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - price
        - durationMinutes
        - isActive
        - createdAt

    CreateServiceBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        durationMinutes:
          type: integer
        imageUrl:
          type: string
        isActive:
          type: boolean
      required:
        - name
        - description
        - price
        - durationMinutes

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        city:
          type: string
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        phone:
          type: string
          nullable: true
        openTime:
          type: string
        closeTime:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - address
        - city
        - openTime
        - closeTime
        - isActive
        - createdAt

    CreateLocationBody:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        phone:
          type: string
        openTime:
          type: string
        closeTime:
          type: string
        isActive:
          type: boolean
      required:
        - name
        - address
        - city
        - openTime
        - closeTime

    Timeslot:
      type: object
      properties:
        id:
          type: integer
        locationId:
          type: integer
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        isAvailable:
          type: boolean
        maxBookings:
          type: integer
        currentBookings:
          type: integer
      required:
        - id
        - locationId
        - date
        - startTime
        - endTime
        - isAvailable
        - maxBookings
        - currentBookings

    ConfigureTimeslotsBody:
      type: object
      properties:
        locationId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        openTime:
          type: string
        closeTime:
          type: string
        slotDurationMinutes:
          type: integer
        maxBookingsPerSlot:
          type: integer
      required:
        - locationId
        - startDate
        - endDate
        - openTime
        - closeTime
        - slotDurationMinutes
        - maxBookingsPerSlot

    Booking:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        serviceId:
          type: integer
        locationId:
          type: integer
        timeslotId:
          type: integer
        status:
          type: string
          enum: [confirmed, completed, cancelled]
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        notes:
          type: string
          nullable: true
        service:
          $ref: "#/components/schemas/Service"
          nullable: true
        location:
          $ref: "#/components/schemas/Location"
          nullable: true
        user:
          $ref: "#/components/schemas/User"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - serviceId
        - locationId
        - timeslotId
        - status
        - date
        - startTime
        - endTime
        - createdAt

    CreateBookingBody:
      type: object
      properties:
        serviceId:
          type: integer
        locationId:
          type: integer
        timeslotId:
          type: integer
        date:
          type: string
          format: date
        notes:
          type: string
      required:
        - serviceId
        - locationId
        - timeslotId
        - date

    UpdateBookingStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, completed, cancelled]
      required:
        - status

    CreateProviderBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
        locationId:
          type: integer
      required:
        - name
        - email
        - password

    AssignProviderBody:
      type: object
      properties:
        locationId:
          type: integer
      required:
        - locationId

    ProviderStats:
      type: object
      properties:
        totalCompleted:
          type: integer
        totalToday:
          type: integer
        totalThisWeek:
          type: integer
        totalThisMonth:
          type: integer
      required:
        - totalCompleted
        - totalToday
        - totalThisWeek
        - totalThisMonth

    AdminDashboard:
      type: object
      properties:
        totalBookings:
          type: integer
        todayBookings:
          type: integer
        completedBookings:
          type: integer
        cancelledBookings:
          type: integer
        confirmedBookings:
          type: integer
        totalRevenue:
          type: number
        totalLocations:
          type: integer
        totalProviders:
          type: integer
        totalCustomers:
          type: integer
        recentBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
      required:
        - totalBookings
        - todayBookings
        - completedBookings
        - cancelledBookings
        - confirmedBookings
        - totalRevenue
        - totalLocations
        - totalProviders
        - totalCustomers
        - recentBookings

    CustomerDashboard:
      type: object
      properties:
        upcomingCount:
          type: integer
        completedCount:
          type: integer
        nextBooking:
          $ref: "#/components/schemas/Booking"
          nullable: true
        recentBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
      required:
        - upcomingCount
        - completedCount
        - recentBookings
